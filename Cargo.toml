[workspace]
resolver = "2"
members = [
    "oraclehub/crates/types",
    "oraclehub/crates/wad",
    "oraclehub/contracts/hub",
    "oraclehub/contracts/adapters/reflector_price",
    "oraclehub/contracts/adapters/blend_rate",
    "oraclehub/contracts/adapters/benji_yield",
    "oraclehub/contracts/adapters/usde_rate",
    "oraclehub/contracts/adapters/custom_apr",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSL-1.2"
rust-version = "1.83"
publish = false

[workspace.dependencies]
# Bumped from 22 → 25 to match `blend-contract-sdk`, which pulls in
# soroban-sdk 25.3 transitively. Keeping a single soroban-sdk version across
# the dependency tree is mandatory — divergent versions produce duplicated
# `Address`/`Env` types that fail to unify at the contractimport boundary.
soroban-sdk = "25"
# Canonical Blend Protocol contract bindings — provides `pool::Client` and types
# auto-derived from the published Pool WASM via `soroban_sdk::contractimport!`.
blend-contract-sdk = "2"
# OpenZeppelin Stellar Contracts — peer-reviewed access control, pausable,
# upgradeable utilities. We use `Ownable` instead of hand-rolling admin state
# machines, `Pausable` for emergency stop, and `upgradeable::upgrade` as a
# standardised wrapper around `update_current_contract_wasm`.
stellar-access = "0.7"
stellar-contract-utils = "0.7"
stellar-macros = "0.7"
# Script3's fixed-point math (used by Blend itself). FixedPoint trait on i128
# with checked overflow + floor/ceil rounding modes; Soroban variants route
# through I256 intermediates to avoid phantom overflow. Replaces our internal
# `oraclehub-wad` mul/div primitives.
soroban-fixed-point-math = "1"
oraclehub-types = { path = "oraclehub/crates/types" }
oraclehub-wad = { path = "oraclehub/crates/wad" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
